[project]
name = "rail-extract"
version = "0.1.0"
description = "LoRA fine-tuning vs prompting for extracting requirements from EU railway TSI passages."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
# Heavy dependencies for GPU runs only. Not installed in CI; tests mock the models.
train = [
    "transformers==5.22.2",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "xgrammar==0.2.8",
    "torch",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_extract"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
