<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label requirements</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6672; --line:#d5dae0; --card:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:16px; flex-wrap:wrap; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { font-size:16px; }
  .muted { color:var(--muted); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  h2 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #passage { white-space:pre-wrap; font:14px/1.55 ui-monospace, Menlo, monospace; max-height:70vh; overflow:auto; }
  textarea { width:100%; min-height:300px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:13px/1.45 ui-monospace, Menlo, monospace; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px 12px; font:inherit; cursor:pointer; min-height:36px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msgs { margin:8px 0 0; padding:0; list-style:none; }
  #msgs li { padding:2px 0; }
  .bad { color:var(--bad); } .warn { color:var(--warn); } .ok { color:var(--ok); }
  .draft { font-size:12px; }
</style>
</head>
<body>
<header>
  <b>Label requirements</b>
  <span id="prog" class="muted">loading…</span>
  <span id="clock" class="muted"></span>
  <span class="muted">Ctrl+Enter saves · rules: docs/LABELLING.md</span>
</header>
<main>
  <section>
    <h2>Passage <span id="where" class="muted"></span></h2>
    <div id="passage" tabindex="0"></div>
  </section>
  <section>
    <h2>Label (JSON) <span id="source" class="muted draft"></span></h2>
    <textarea id="json" spellcheck="false" aria-label="Label as JSON"></textarea>
    <ul id="msgs" aria-live="polite"></ul>
    <div class="row">
      <button class="primary" id="save">Save and next</button>
      <button id="empty">No requirement</button>
      <button id="add">Add requirement</button>
      <label><input type="checkbox" id="unsure"> unsure</label>
      <button id="skip">Skip (table / unusable)</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cur = null, shownAt = 0, activeMs = 0, lastTick = 0, timer = null;
const TEMPLATE = {parameter:"", comparator:">=", value:0, value_max:null, unit:"", conditions:[], quote:""};

function tick() {
  const now = Date.now();
  if (document.hasFocus() && now - lastTick < 5000) activeMs += now - lastTick;
  lastTick = now;
  $("clock").textContent = Math.round(activeMs/1000) + " s on this passage";
}
async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", body: JSON.stringify(body)} : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function showProgress(p) {
  const m = Math.floor(p.seconds/60);
  $("prog").textContent = `${p.done}/${p.target} done · ${p.unsure} unsure · ${p.skipped} skipped · ${Math.floor(m/60)} h ${m%60} min labelled`;
}
function msg(items, cls) { for (const t of items) { const li = document.createElement("li"); li.className = cls; li.textContent = t; $("msgs").appendChild(li); } }
function setJson(reqs) { $("json").value = JSON.stringify({requirements: reqs}, null, 2); }
async function load(id) {
  const j = await api("/api/next" + (id ? "?id=" + encodeURIComponent(id) : ""));
  showProgress(j.progress);
  $("msgs").replaceChildren();
  if (!j.id) { cur = null; $("passage").textContent = "All done for this split."; $("json").value = ""; $("where").textContent = ""; clearInterval(timer); return; }
  cur = j; activeMs = 0; lastTick = Date.now();
  clearInterval(timer); timer = setInterval(tick, 1000);
  $("where").textContent = j.section;
  $("passage").textContent = j.heading + "\n\n" + j.text;
  const src = j.existing ? {requirements: j.existing.requirements, unsure: j.existing.unsure, name: "your saved label"}
            : j.draft ? {requirements: j.draft.requirements, unsure: !!j.draft.unsure, name: "DRAFT, check every field"} : null;
  $("source").textContent = src ? "· " + src.name : "· empty";
  setJson(src ? src.requirements : []);
  $("unsure").checked = src ? src.unsure : false;
  if (j.draft && j.draft.note) msg(["draft note: " + j.draft.note], "warn");
  await check();
}
function parse() {
  try { return JSON.parse($("json").value).requirements; } catch (e) { return null; }
}
async function check() {
  $("msgs").replaceChildren();
  const reqs = parse();
  if (!reqs) { msg(["not valid JSON"], "bad"); return false; }
  const r = await api("/api/check", {id: cur.id, requirements: reqs});
  msg(r.errors, "bad"); msg(r.warnings, "warn");
  if (r.valid && !r.warnings.length) msg(["checks pass (" + reqs.length + " requirement" + (reqs.length === 1 ? "" : "s") + ")"], "ok");
  return r.valid;
}
async function save(extra) {
  if (!cur) return;
  const skipped = !!(extra && extra.skipped);
  const reqs = skipped ? [] : parse();
  if (!skipped && (!reqs || !(await check()))) return;
  tick();
  const p = await api("/api/save", {id: cur.id, requirements: reqs, unsure: $("unsure").checked, seconds: activeMs/1000, ...(extra || {})});
  showProgress(p.progress);
  await load();
}
$("save").onclick = () => save();
$("empty").onclick = () => { setJson([]); check(); };
$("add").onclick = () => { const r = parse() || []; r.push({...TEMPLATE}); setJson(r); check(); };
$("skip").onclick = () => { const why = prompt("Why skip? (table / scope only / other)", "table"); if (why !== null) save({skipped:true, skip_reason: why}); };
$("json").addEventListener("input", () => { clearTimeout(window._t); window._t = setTimeout(check, 400); });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); save(); } });
load().catch((e) => { $("prog").textContent = "error: " + e.message; });
</script>
</body>
</html>
